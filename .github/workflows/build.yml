name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Explicitly publish the fully verified delivery
        type: boolean
        default: false
        required: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            target: ""
            tauri_cli_asset: cargo-tauri-x86_64-unknown-linux-gnu.tgz
            artifact_name: amorist-deb
            artifact_glob: src-tauri/target/release/bundle/deb/amorist_*.deb
          - os: ubuntu-latest
            bundle: appimage
            target: ""
            tauri_cli_asset: cargo-tauri-x86_64-unknown-linux-gnu.tgz
            artifact_name: amorist-appimage
            artifact_glob: src-tauri/target/release/bundle/appimage/amorist_*.AppImage
          - os: macos-latest
            bundle: dmg
            target: universal-apple-darwin
            tauri_cli_asset: cargo-tauri-aarch64-apple-darwin.zip
            artifact_name: amorist-dmg
            artifact_glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/amorist_*.dmg
          - os: windows-latest
            bundle: nsis
            target: x86_64-pc-windows-msvc
            tauri_cli_asset: cargo-tauri-x86_64-pc-windows-msvc.zip
            artifact_name: amorist-windows-setup
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/amorist_*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev heif-gdk-pixbuf \
            libheif-plugin-aomdec webkit2gtk-driver xvfb bubblewrap

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install Tauri CLI
        env:
          # Pinned deliberately. tauri-apps/tauri is a monorepo publishing several
          # release trains, and "latest" is simply whichever was cut last: it points
          # at a tauri-vX.Y.Z core release (no CLI assets) as often as at a CLI one,
          # which 404s this download. Bump this tag to update the CLI.
          TAURI_CLI_TAG: tauri-cli-v2.11.4
        run: |
          url="https://github.com/tauri-apps/tauri/releases/download/$TAURI_CLI_TAG/${{ matrix.tauri_cli_asset }}"
          dest="$HOME/.cargo/bin"
          mkdir -p "$dest"
          case "${{ matrix.tauri_cli_asset }}" in
            *.tgz)
              curl -fsSL "$url" | tar xz -C "$dest"
              ;;
            *.zip)
              tmp=$(mktemp -d)
              curl -fsSL "$url" -o "$tmp/tauri.zip"
              unzip -q -o "$tmp/tauri.zip" -d "$dest"
              chmod +x "$dest"/cargo-tauri*
              rm -rf "$tmp"
              ;;
          esac

      - name: Build bundle
        env:
          # GitHub runners lack FUSE; let appimagetool/linuxdeploy run by
          # self-extracting instead of mounting. Harmless for deb/dmg builds.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "${{ matrix.bundle }}" = "appimage" ]; then
            amorist_bundle_config="$RUNNER_TEMP/amorist-appimage-decoders.json"
            python3 src-tauri/linux/prepare-appimage.py "$amorist_bundle_config"
            cargo tauri build --bundles appimage --config "$amorist_bundle_config" --config "{\"version\": \"$VERSION\"}"
          elif [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --bundles "${{ matrix.bundle }}" --target "${{ matrix.target }}" --config "{\"version\": \"$VERSION\"}"
          else
            cargo tauri build --bundles "${{ matrix.bundle }}" --config "{\"version\": \"$VERSION\"}"
          fi

      - uses: actions/setup-node@v4
        if: matrix.bundle == 'appimage'
        with:
          node-version: '22'

      - name: Install native AppImage QA driver
        if: matrix.bundle == 'appimage'
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Verify packaged images without the host AV1 decoder
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/tests/qa/lib/no-host-av1.sh" \
          AMORIST_CODEC_QA_BINARY="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a node tests/editor-local-image-native.test.js

      - name: Verify packaged preferences and clean native restarts
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a node tests/editor-settings-native.test.js

      - name: Verify packaged review loop and native Bug capture
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a python3 tests/editor-review-loop-native.test.py

      - name: Verify packaged clipboard across application processes
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a node tests/editor-clipboard-native.test.js

      - name: Verify packaged recovery preserves automatic boundary ownership
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a node tests/editor-recovery-boundaries-native.test.js

      - name: Verify packaged recovery deadlines on real disk
        if: matrix.bundle == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          AMORIST_QA_APPLICATION="$PWD/src-tauri/target/release/bundle/appimage/amorist_${VERSION}_amd64.AppImage" \
          GDK_BACKEND=x11 xvfb-run -a node tests/editor-recovery-deadline-native.test.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}

  # The release gate. G-RELEASE in the QA contract: publication is blocked while
  # any blocking requirement fails. Commits, merges and pushes are not blocked —
  # only what reaches a user is.
  qa:
    uses: ./.github/workflows/qa.yml

  release:
    needs: [build, qa]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require completed development delivery
        run: python3 scripts/check-delivery-gate.py

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DEB=$(ls dist/amorist-deb/amorist_*.deb)
          DMG=$(ls dist/amorist-dmg/amorist_*.dmg)
          APPIMAGE=$(ls dist/amorist-appimage/amorist_*.AppImage)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$DEB" "$DMG" "$APPIMAGE" --clobber
          else
            gh release create "v$VERSION" "$DEB" "$DMG" "$APPIMAGE" \
              --title "v$VERSION" \
              --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
