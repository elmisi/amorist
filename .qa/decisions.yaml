decisions:
  - id: D-002
    statement: No tests are to be written during this session. Discovery output only.
    source: user-statement
    status: confirmed

  - id: D-003
    statement: >
      Markdown is the source of truth and the editor roundtrips through Markdown
      on every mode switch, not only on save.
    source: repo-evidence
    evidence: CLAUDE.md "Data flow"; amorist-editor.js showWysiwygMode -> setMarkdown
    status: confirmed

  - id: D-005
    statement: >
      The disk write path is atomic (tmp + rename) and guarded by an mtime
      conflict check with an explicit user override.
    source: repo-evidence
    evidence: src-tauri/src/lib.rs save_document
    status: confirmed
    note: >
      Durability of the write is well built. The exposure is upstream, in the
