# amorist — QA contract
#
# APPROVED by the repository owner on 2026-07-28.
#
# From here on this file is the source of truth for what "correct" means. A
# check may not be weakened to make a run go green: amend the contract first,
# have the amendment approved, then change the check. A check changed without a
# contract amendment is a contract breach whatever the suite reports (R-018).
#
# Provenance: .qa/decisions.yaml (28 decisions, Discovery 2026-07-26/27 plus the
# three points closed on 2026-07-28) and .qa/risks.yaml (15 risks, each with the
# evidence that produced it).
# Repository state at authoring time: commit a9d7e73.

status: approved
approved_by: repository owner
approved_on: 2026-07-28

amendments:
  - date: 2026-08-17
    authorised_by: repository owner, after hands-on testing of version 0.10.6
    what: >
      Source fidelity and view continuity remain mandatory but are not sufficient
      when the live projection loses established visual containment or ordinary
      typing exceeds an interactive budget. REQ-B8 requires one framed,
      independently horizontally scrollable projection block per pipe table and
      fenced-code region. REQ-B9 requires stable same-line typing to replace only
      its affected projection unit, retain unrelated DOM identity, and meet the
      declared 500-line and 1,500-line event-to-frame budgets in every applicable
      browser engine.
    why: >
      Version 0.10.6 restored exact source authority and view-position continuity,
      but it rebuilds the complete projection on every key, performs interleaved
      table geometry reads and writes, and no longer contains wide tables or code
      blocks in their own visual frame. Those regressions make the safe editor
      visibly and measurably less usable without invalidating its source model.
    source: repository owner statements and implementation approval, 2026-08-17

  - date: 2026-08-14
    authorised_by: repository owner, after hands-on testing of version 0.10.5
    what: >
      WYSIWYG editing must implement conventional list workflows as local
      source transactions. REQ-B6 covers marker shortcuts, Enter continuation
      and splitting, empty-item exit, and Backspace removal; REQ-B7 applies the
      same boundary discipline to headings and quotes. REQ-B3 remains the
      plain-prose Enter rule and no longer claims that structural Enter can
      insert only a bare newline.
    why: >
      Source preservation and correct view switching are insufficient when
      ordinary list editing regresses behind every established text editor.
      The repository owner explicitly required these conventions to be derived
      and tested as a workflow matrix rather than reported one defect at a time.
    source: repository owner statements and implementation approval, 2026-08-14

  - date: 2026-08-14
    authorised_by: repository owner, during hands-on testing of version 0.10.4
    what: >
      Preservation is necessary but not sufficient for release: REQ-B4 requires
      ordinary typing to continue at the visual caret when Markdown markers are
      projected; REQ-B5 restores display-only alignment for pipe tables; REQ-C2
      preserves the natural start/end edge where centring is geometrically
      impossible; and REQ-C3 requires a failed WYSIWYG render to keep Source
      visible with a warning.
    why: >
      Manual use exposed a bullet whose following text was inserted before its
      marker, incorrect positioning at the first and last viewport, and an empty
      white editor after a rendering failure. An editor that preserves bytes but
      cannot be typed into normally is not usable and is not release-ready.
    source: repository owner statements and approval, 2026-08-14

  - date: 2026-07-28
    authorised_by: >
      repository owner, against the scope described here and no wider
    what: >
      REQ-G2 goes from naming one engine on one platform to declaring, per
      platform, which engines are applicable there — adding Safari on macOS,
      driven through the system's own WebDriver server. REQ-G3's residue shrinks
      to match, and release readiness now composes runs across platforms rather
      than resting on one.
    why: >
      The original assessment recorded macOS as beyond automation because the
      only alternative weighed was a different build of WebKit on a different
      platform, which would have been a proxy dressed as coverage. It skipped an
      intermediate rung: WebKit ON macOS, driven by the driver the system
      already ships. That is still not WKWebView, but it is far closer to it
      than a Chromium-family stand-in on Linux is — and it speaks the same
      protocol the suite already implements, so the cost is small.
    source: D-030

product:
  name: amorist
  primary_value: >
    Never alter the user's file except as the direct result of an edit the user
    made. Markdown files live in git; a diff that does not correspond to an edit
    is damage, not formatting.
  editing_value: >
    The WYSIWYG remains a usable text editor. Visual projections may hide or
    decorate Markdown syntax, but normal typing must continue at the visible
    caret and must produce the text the user typed in its intended order.

users:
  - id: U-1
    description: >
      Single local author editing their own Markdown files. The same files are
      also opened in Zed, Sublime Text and VS Code, are tracked in git, and are
      reviewed as diffs. Document families in use: Obsidian-style notes with
      front matter and wiki links, technical documentation with fenced code and
      tables, hand-wrapped prose drafts, and files that have passed through
      several tools and carry inconsistent formatting.

critical_tasks:
  - id: T-1
    description: Open a file, read it, close it without changing anything.
  - id: T-2
    description: Fix a typo in one line and save.
  - id: T-3
    description: Write a new note from scratch, wrapping lines by hand.
  - id: T-4
    description: Switch to the source view to check the markup, and back.
  - id: T-5
    description: Paste content from a web page.
  - id: T-6
    description: Resume work after the application died without a save.

unacceptable_failures:
  - Any byte of the file changes without a corresponding user edit.
  - An edit in one place changes bytes in another place.
  - Content the user pasted disappears with no trace and no warning.
  - Unsaved work is lost with no recovery path.
  - A check cannot run and the suite reports success anyway.
  - The suite is green and would not catch a deliberately reintroduced defect.

accepted_tradeoffs:
  table_alignment: >
    Automatic column re-alignment is removed from both open and save. Tables keep
    the spacing found in the file, ragged or not. Re-alignment becomes a command
    the user invokes. Source: D-012, forced by R-012.
  rendering_model: >
    The WYSIWYG stops being a CommonMark renderer and becomes a text editor with
    visible formatting: soft breaks are shown as line breaks rather than spaces.
    Source: D-017.
  whitespace_divergence: >
    amorist preserves trailing whitespace that the user's own Zed deletes on save
    (remove_trailing_whitespace_on_save defaults to true). The two tools will
    disagree; amorist is never the one introducing the change. Source: D-022.
  paste_fidelity: >
    Conversion quality of pasted rich text is not promised — only that nothing
    recognisable disappears. Full-fidelity HTML conversion is an unbounded
    promise. Source: D-023.
  perimeter: >
    The deprecated Python browser mode (bin/amorist) is outside the contract. It
    is neither guaranteed nor used as test scaffolding. Source: D-020.
  paragraph_reflow: >
    No "reformat paragraph" command is provided. Line breaks are only ever moved
    by the user. Source: D-017, rejected alternative.

release_gates:
  - id: G-RELEASE
    rule: >
      Publication of a release is blocked while any blocking requirement fails.
    source: D-025
  - id: G-PUSH
    rule: >
      Checks run on every push and their result is visible, but a red result does
      not block a commit, a merge, or a push. This placement is deliberate:
      everything is red today, and a gate on commits would block the very work
      that makes it green.
    source: D-025
    future: >
      Tighten to merges once the suite is green — an easy decision to take then.

fallback_policies:
  missing_engine: >
    If an engine APPLICABLE to the running platform cannot be found or started,
    the run FAILS and names which one. Never skipped-and-green, and never "the
    other engine passed, so we are fine": an applicable engine missing means part
    of the coverage is absent, which is precisely the situation a report must not
    hide. The existing tests/app-shell-smoke.test.js exits successfully when it
    finds no browser; the new runner must not inherit that behaviour. See REQ-G1,
    REQ-G2, and inapplicable_engine below for the one permitted skip.
  inapplicable_engine: >
    An engine that does not exist on the current platform is skipped and recorded
    as inapplicable, not as missing, and does not fail the run. This is the ONE
    place the suite is allowed to pass over something, and it is safe only
    because the set of applicable engines is declared per platform in REQ-G2
    rather than inferred: an engine can only be skipped if the contract says it
    does not belong here.
  missing_display: >
    Where no display is available, a virtual one is started by the runner. If it
    cannot be started, the run FAILS with that cause named. It is not degraded to
    a single-engine run.
  missing_corpus: >
    If the fixture directory is empty or unreadable, the run FAILS. A check that
    iterates over zero files must not pass.
  external_corpus: >
    No user files are copied into the repository. The corpus is entirely
    synthetic (D-026), so local and CI runs use identical inputs and there is no
    "green here, red there" ambiguity.

environments:
  - id: ENV-linux
    description: >
      Linux, Tauri 2 with WebKitGTK. The publishing workflow builds deb and
      AppImage on ubuntu-latest.
  - id: ENV-macos
    description: >
      macOS, Tauri 2 with WKWebView. The publishing workflow builds a dmg on
      macos-latest, universal target.
    note: >
      Windows is not built by .github/workflows/build.yml and is out of scope.
  - id: ENV-checks
    description: >
      The editor checks run once per applicable engine, from one set of check
      code behind a small driver interface. The shipping engine on Linux is
      WebKitGTK and on macOS is Safari, each driven through its own WebDriver
      server over plain HTTP — one protocol, two hosts. Alongside it runs a
      Chromium-family stand-in over the DevTools protocol. All of them use node
      builtins only and load a test page that pulls in web/editor/*.js alone,
      with no server and no app shell. The disk checks run as Rust tests over
      temporary files. Source: D-014, D-020, D-029, D-030.
    caveat: >
      On both platforms the engine is driven inside a TEST host, not inside the
      application: a small reference browser on Linux, the system browser on
      macOS. Same engine, different embedding. What the runs cover is the engine;
      what no run covers is the embedding. That residue is recorded as REQ-G3 and
      is symmetric across platforms.

requirements:

  # ---------------------------------------------------------------- family A
  # The file on disk. This is the primary value; every requirement here is a
  # different way for the same promise to break.

  - id: REQ-A1
    statement: >
      Open any .md file, type one character, delete it, save. The file on disk
      must be byte-identical to what it was before.
    category: invariant
    origin: user-statement, 2026-07-27 (P1)
    motivation: >
      Markdown files live in git. A diff that does not correspond to an edit
      pollutes history and review.
    risk_id: R-010
    verification:
      type: deterministic
      evidence_required:
        - the original file bytes
        - the bytes produced after the neutral edit
        - on failure, a byte-level diff naming the first differing offset
      success_condition: >
        For every file in the corpus: bytes_after == bytes_before, with no
        exception for whitespace, line endings, or the final newline.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low per case once the harness exists
    currently_holds: false
    status: confirmed

  - id: REQ-A2
    statement: >
      After a real edit, only the edited line may differ between the file before
      and the file after. No other line may change.
    category: invariant
    origin: user-statement (Q-006 answer, D-012)
    motivation: >
      "Only what I changed shows up in the diff" is the property that makes the
      editor usable in a reviewed repository.
    risk_id: R-010
    allowed_change:
      gestures:
        - id: insert
          affected_lines: caret
          line_delta: 0
        - id: enter
          affected_lines: caret-and-next
          line_delta: 1
        - id: list-enter
          affected_lines: current-list-item-and-new-item
          line_delta: 1
        - id: list-exit
          affected_lines: empty-list-item
          line_delta: 0
        - id: list-backspace
          affected_lines: current-list-item
          line_delta: 0
        - id: block-enter
          affected_lines: current-block-and-next-line
          line_delta: 1
        - id: block-exit
          affected_lines: empty-structural-block
          line_delta: 0
        - id: block-backspace
          affected_lines: current-structural-block
          line_delta: 0
        - id: backspace
          affected_lines: boundary-pair
          line_delta: -1
        - id: paste
          affected_lines: caret-plus-inserted-lines
          line_delta: inserted-lines-minus-one
        - id: selection-replace
          affected_lines: selected-lines-and-inserted-lines
          line_delta: replacement-dependent
        - id: format
          affected_lines: affected-construct
          line_delta: 0
        - id: codeblock
          affected_lines: selected-lines-plus-fence-lines
          line_delta: 2
        - id: indent
          affected_lines: affected-list-item
          line_delta: 0
        - id: undo-redo
          affected_lines: reverted-transaction
          line_delta: transaction-dependent
    verification:
      type: deterministic
      evidence_required:
        - the edit position and the text typed
        - the set of line numbers that differ before/after
      success_condition: >
        The set of changed lines is exactly the set the edit can account for.
        That set MUST be defined in the check for each edit kind, and the
        definition is part of this contract:
          - insert/delete within a line -> that line only
          - Enter pressed -> the line at the caret, plus one new line after it
          - deletion across a line boundary -> the two lines, merged into one
          - paste of N lines -> the caret line plus N-1 new lines
          - typing over a selection spanning N lines -> those N lines collapsed
            into one, plus whatever lines the typed text itself introduces
          - a toolbar action or keyboard shortcut (bold, heading, list marker,
            Tab / Shift-Tab indent) -> only the lines the affected construct
            occupies; indenting one list item changes that item's line alone,
            not the rest of the list
          - code-block toolbar action -> the selected lines plus the two fence
            lines the command adds
          - undo or redo -> exactly the lines the reverted edit had touched,
            and no others
        Any edit kind not in this list must be added here before it is tested.
    severity: blocking
    false_positive_risk: medium
    false_positive_note: >
      The risk is in the definition above, not in the measurement. An incomplete
      definition produces either false alarms or false silence.
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed

  - id: REQ-A3
    statement: >
      A region the user touched but whose content ended up unchanged must be
      written back exactly as it was in the file, including its line wrapping.
    category: invariant
    origin: user-statement (Q-005 answer)
    motivation: >
      Without this, REQ-A1 would be vacuous: typing and deleting a character
      marks its region as touched, and a re-emitted region loses the author's
      line breaks.
    risk_id: R-005
    verification:
      type: deterministic
      evidence_required:
        - a hand-wrapped paragraph, edited then reverted, before and after bytes
      success_condition: >
        Bytes identical. The comparison the editor performs internally to decide
        "unchanged" must ignore line wrapping, since the DOM round trip yields
        the unwrapped form; the comparison the CHECK performs must not.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-A4
    statement: >
      Invisible characters are preserved verbatim: trailing spaces stay, a file
      that ended with a newline keeps it, a file that did not does not gain one.
      amorist never tidies up.
    category: invariant
    origin: user-statement (Q-018 answer, D-022)
    motivation: >
      Two trailing spaces are Markdown content (a hard break), not dirt. And any
      "cleanup" is by definition a change the user did not ask for.
    risk_id: R-014
    verification:
      type: deterministic
      evidence_required:
        - corpus files with, and without, a final newline
        - corpus files with pre-existing trailing spaces and hard breaks
      success_condition: >
        Byte identity after a neutral edit, for both states of the final newline
        and with all trailing whitespace intact.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-A5
    statement: >
      Markdown constructs amorist does not understand pass through untouched.
      They are copied verbatim from the original source and are never reparsed
      or re-emitted.
    category: invariant
    origin: user-statement (Q-003 answer, D-010)
    motivation: >
      The promise covers ANY .md file. The only way to keep it with a partial
      codec is to never let the codec near what it does not understand.
    risk_id: R-002
    verification:
      type: deterministic
      evidence_required:
        - corpus files containing YAML front matter, indented code blocks,
          nested blockquotes, footnotes, reference links, raw HTML blocks,
          setext headings, wiki links
      success_condition: >
        Byte identity after a neutral edit, and after an edit in an unrelated
        part of the same file.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed

  - id: REQ-A6
    statement: >
      Table spacing is preserved as found in the file. No column re-alignment
      happens on open or on save.
    category: invariant
    origin: user-statement (Q-006 answer, D-012)
    motivation: >
      Re-alignment currently runs while the file is being READ, so opening and
      saving a hand-spaced table rewrites it with no edit at all.
    risk_id: R-012
    verification:
      type: deterministic
      evidence_required:
        - a ragged table, a table with emoji, a table with escaped pipes
        - bytes after open+save, and after editing one cell
      success_condition: >
        Open+save is byte-identical. Editing one cell changes only that cell's
        line, even when the new content is wider than the column.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed
    product_note: >
      Re-alignment is expected to survive as a command the user invokes. That
      command, if built, needs its own requirement stating it changes only the
      table it was invoked on.

  - id: REQ-A7
    statement: >
      List markers and numbering are preserved as the author wrote them.
      A list written with "*" stays "*"; a list numbered "1. 1. 1." keeps it.
    category: invariant
    origin: user-statement (Q-006 answer, D-012)
    motivation: >
      serializeList hardcodes "- " and a progressive counter, so editing one
      item of a thirty-item list rewrites all thirty lines.
    risk_id: R-013
    verification:
      type: deterministic
      evidence_required:
        - lists with "*", "+", "-" markers; ordered lists numbered 1/1/1 and
          1/2/3; nested lists mixing markers per level
      success_condition: >
        Open+save byte-identical; editing one item changes only that item's line.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-A8
    statement: >
      The information string on a fenced code block (the language tag) is
      preserved, along with the fence character and length.
    category: invariant
    origin: derived from P1 and R-001
    motivation: >
      The language tag is content the author wrote. It is currently discarded at
      parse time, so every round trip strips it from every fenced block.
    risk_id: R-001
    verification:
      type: deterministic
      evidence_required:
        - fences with a language, with a language plus metadata, with tildes,
          with more than three markers
      success_condition: Byte identity after a neutral edit.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-A9
    statement: >
      The file's line-ending convention is preserved: a CRLF file stays CRLF, an
      LF file stays LF, and a file with mixed endings is not normalised.
    category: regression
    origin: >
      repository evidence — detect_line_ending / encode_line_endings; the
      per-line rule below decided by the user, D-027
    motivation: >
      This behaviour exists today and must not be lost during the rewrite of the
      save path. The exception for mixed files was closed rather than accepted:
      an exception in the primary promise is the thing this contract exists to
      remove.
    risk_id: R-010
    verification:
      type: deterministic
      evidence_required:
        - a file entirely in LF, a file entirely in CRLF, a file mixing both
        - a file whose last line carries no terminator at all
      success_condition: >
        Byte identity after a neutral edit, for all four files. The rule is per
        line, not per file: every existing line keeps its own terminator
        verbatim, and a line newly created by pressing Enter takes the terminator
        of the line the caret was on. No majority is computed and nothing is
        normalised.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: partially
    currently_holds_note: >
      Files entirely in LF and files entirely in CRLF are handled today. A file
      mixing both is rewritten to the majority convention and fails this
      requirement. Closing that gap costs almost nothing under the
      source-preserving save path: a line copied verbatim from the original
      carries its own terminator with it, so the exception disappears instead of
      needing machinery of its own.
    status: confirmed

  - id: REQ-A10
    statement: >
      Switching between WYSIWYG and source, any number of times and in any
      order, leaves the document byte-identical. Saving after a switch with no
      edit produces the original file.
    category: invariant
    origin: derived from P1 and R-007
    motivation: >
      Today the document is reparsed and re-serialised on every switch, so damage
      accumulates before any save and with no signal to the user. This is the
      only requirement whose failure needs no user action at all.
    risk_id: R-007
    verification:
      type: deterministic
      evidence_required:
        - bytes after 1, 2 and 10 switches with no editing in between
        - the dirty indicator's state after those switches
      success_condition: >
        Bytes identical in all three cases, and the document is not reported as
        modified.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  # ---------------------------------------------------------------- family B
  # What the editing surface shows and does.

  - id: REQ-B1
    statement: >
      Every line of the file is shown as its own line in the WYSIWYG view. Soft
      breaks are not collapsed into spaces.
    category: invariant
    origin: user-statement, 2026-07-27 (P2), refined by D-017
    motivation: >
      The user must be able to see the file's line structure while editing;
      otherwise the structure is preserved on disk but invisible, and edits are
      made blind.
    risk_id: R-005
    verification:
      type: deterministic
      evidence_required:
        - "rendered geometry — the bounding rectangle of the first character of
          each source line, measured in a real browser"
      success_condition: >
        Characters belonging to different source lines never share a vertical
        position, EXCEPT where a single source line is too wide for the viewport
        and wraps visually — that case must be identified by measuring against a
        viewport wide enough to prevent wrapping, so that soft wrap and source
        newlines are never confused.
    severity: blocking
    false_positive_risk: medium
    false_positive_note: >
      Geometry checks are sensitive to fonts, zoom and viewport width. Zoom and
      width are fixed explicitly. The FONT is not, and cannot honestly be: a
      font stack is a preference, and the faces named in it do not all exist on
      every platform — on macOS the stack falls through to whatever the system
      calls monospace. What this check needs is weaker than an identical face:
      a font stable within one run, and a container wide enough that nothing
      wraps. Both hold, so the assertion is sound.

      Cross-platform identity of metrics was then asserted NOT to hold — and
      measurement disagreed with that too. Twenty glyphs come to the same width
      on both platforms, because the two faces that win happen to share the
      advance ratio conventional to monospaced faces. The agreement is real and
      it is a coincidence, not a guarantee: it would move if a stack entry or a
      platform default changed. That is exactly why the number is printed in
      every report rather than reasoned about.

      A future check that turns on wrap points rather than line starts would
      need more than this, and must not assume this note covers it.
    automation: full
    estimated_cost: high
    currently_holds: false
    status: confirmed

  - id: REQ-B2
    statement: >
      Typing lengthens the current line. It never moves the other lines of the
      same paragraph.
    category: invariant
    origin: user-statement (Q-009 answer, D-017)
    motivation: >
      Reflow would put the whole paragraph in the diff and would move line breaks
      the user placed deliberately.
    risk_id: R-005
    verification:
      type: deterministic
      evidence_required:
        - a hand-wrapped paragraph, a long sentence typed into its middle line,
          and the resulting file bytes
      success_condition: >
        Only the edited line differs. The other lines of the paragraph are
        unchanged, whatever the resulting line length.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-B3
    statement: >
      In ordinary prose, Enter inserts a bare newline at the caret. It does not
      create a paragraph break and never writes the two-space hard break.
      Structural list behavior is specified separately by REQ-B6.
    category: invariant
    origin: user-statement (Q-010 answer, D-018)
    motivation: >
      Matches how Sublime and Zed behave, and avoids writing trailing spaces that
      the user's own Zed deletes on save.
    risk_id: R-015
    verification:
      type: deterministic
      evidence_required: [the bytes written after a single Enter keypress]
      success_condition: >
        Exactly one "\n" is inserted at the caret offset. No spaces are added
        before it, and no blank line after it.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-B4
    statement: >
      When typed Markdown becomes a visual construct, subsequent typing remains
      at the visible caret after that construct's hidden marker. Projection must
      never reorder the characters the user types.
    category: invariant
    origin: user-statement, 2026-08-14
    motivation: >
      Byte preservation does not make an editor usable if typing "- alpha"
      produces "alpha- " or places the caret before the displayed bullet.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - real key sequences for an empty bullet, ordered item, quote, heading,
          and task item in every applicable browser engine
        - the measured caret position immediately after a bullet or ordered
          marker shortcut, before the first item character is typed
        - the resulting Markdown bytes and the visible text
      success_condition: >
        Each sequence remains in its typed order, its text is visible after the
        projected marker, and no unrelated byte changes.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: true
    status: confirmed

  - id: REQ-B6
    statement: >
      WYSIWYG list editing follows conventional editor behavior while retaining
      exact Markdown authority. Typing a bullet or ordered marker followed by
      Space leaves the caret after the visual marker. Enter continues the list
      with the same bullet spelling or the next ordered number; in the middle it
      splits the item. Enter on an empty item exits the list. Backspace at the
      start of item content removes that item's list prefix.
    category: invariant
    origin: user-statement, 2026-08-14
    motivation: >
      An editor that preserves bytes but cannot continue, split or exit a list
      is not usable for ordinary writing. These are baseline editing semantics,
      not optional Markdown automation.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - real key sequences for -, *, +, dotted and parenthesized ordered
          markers, and task items
        - Enter at the end, in the middle and on an empty item
        - Backspace at the first visible item character
        - exact resulting Markdown and visible caret placement in every
          applicable browser engine
      success_condition: >
        Every sequence produces only its declared local source transaction.
        Bullet spelling and indentation are retained; ordered continuation uses
        the next integer with the same delimiter; a continued task starts
        unchecked; and subsequent typing appears after the visual marker.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: true
    status: confirmed

  - id: REQ-B7
    statement: >
      Hidden heading and quote prefixes participate in conventional WYSIWYG
      editing. Enter continues a non-empty quote and exits an empty quote.
      Enter in or at the end of a heading creates an ordinary text line rather
      than another heading. Enter on an empty heading exits it. Backspace at the
      first visible character removes the complete structural prefix.
    category: invariant
    origin: derived from the repository owner's editing-usability mandate, 2026-08-14
    motivation: >
      The same projection boundary that broke list typing also affects headings
      and quotes. Leaving those paths to browser-specific contenteditable
      behavior would knowingly retain the same class of regression.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - real Enter keys at the end, middle and empty state of headings and quotes
        - real Backspace at the first visible character
        - exact resulting Markdown in every applicable browser engine
      success_condition: >
        Quote continuation retains its exact marker spelling; heading Enter
        creates plain text; empty structures exit; Backspace removes the whole
        hidden prefix; and no unrelated source line changes.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: true
    status: confirmed

  - id: REQ-B5
    statement: >
      Pipe-table columns are visually aligned in WYSIWYG without changing the
      source spacing. Alignment is a display projection, never a source rewrite.
    category: invariant
    origin: user-statement, 2026-08-14
    motivation: >
      The previous aligned text-block rendering made tables substantially easier
      to read without requiring HTML tables. That usability can coexist with A6
      when padding belongs only to layout.
    risk_id: R-012
    verification:
      type: deterministic
      evidence_required:
        - a deliberately ragged pipe table rendered in every applicable engine
        - measured horizontal positions for every pipe boundary
        - Markdown bytes before and after rendering and view switches
      success_condition: >
        Corresponding pipe boundaries share the same horizontal position within
        one device pixel and the Markdown remains byte-identical.
    severity: blocking
    false_positive_risk: medium
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  - id: REQ-B8
    statement: >
      Every recognized pipe table and fenced code region is projected as one
      visually framed WYSIWYG block with its own horizontal scroll owner. A wide
      block scrolls locally; the editor surface, document viewport and every other
      block retain their horizontal position. Table alignment is display-only and
      rendering or scrolling never changes source bytes.
    category: invariant
    origin: user-statement, 2026-08-17
    motivation: >
      The 0.10.6 line-faithful projection removed the established containment of
      tables and code blocks. Wide source then becomes clipped by the editor
      surface and cannot be inspected without weakening the safe source model.
    risk_id: R-019
    verification:
      type: deterministic
      evidence_required:
        - one narrow table, two wide tables and one wide fenced-code block in
          every applicable browser engine
        - backtick and tilde fences, including an info string
        - computed 1 px border, 8 px radius, 16 px padding and horizontal-only
          local overflow on each live wrapper
        - independent scrollLeft observations for both wide tables and the code
          block, plus the editor surface and document viewport
        - exact Markdown bytes before and after rendering, local scrolling and
          view switches; REQ-B5 supplies the independent pipe-alignment verdict
      success_condition: >
        Each table and fenced region has exactly one framed wrapper and retains a
        source-line descendant for every physical line. Every wide wrapper can
        scroll horizontally without moving another wrapper, the surface or the
        document viewport; vertical overflow remains owned by the editor view;
        REQ-B5 is green; and source bytes remain identical.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed

  - id: REQ-B9
    statement: >
      Ordinary within-line typing updates only the affected projection unit and
      appears at the visible caret by the next animation frame. On deterministic
      500-line and 1,500-line mixed documents, plain-text and table-cell targets
      each receive 3 warm-up keys and 20 measured keys in every applicable
      browser engine. The nearest-rank p95 is sample 19 after sorting: at most
      50 ms for 500 lines and at most 100 ms for 1,500 lines.
    category: invariant
    origin: user-statement and measured regression, 2026-08-17
    motivation: >
      Rebuilding the whole live projection and laying out every table for each
      character causes visible stalls. A timing threshold alone can pass on a
      fast host, so unchanged DOM identity outside the projection unit is an
      independent structural requirement.
    risk_id: R-020
    verification:
      type: deterministic
      evidence_required:
        - exactly 500- and 1,500-physical-line deterministic documents containing
          prose/list filler and one ragged three-row table every 40 lines
        - a unique plain-text target and a unique cell target in an existing table
        - 3 unrecorded warm-up keys followed by all 20 event-to-next-frame samples
          for every engine, size and target combination
        - eight nearest-rank p95 values, calculated by sorting each 20-sample set
          and taking sample 19
        - untouched-row DOM identity during prose, list, table-cell and fenced-code
          same-line edits, plus exact typed source ordering and byte preservation
      success_condition: >
        All 160 measured samples and eight p95 values are present in the report;
        every 500-line p95 is at most 50 ms and every 1,500-line p95 is at most
        100 ms; no stable same-line gesture performs a full projection render;
        nodes outside the affected prose/list/code row or table wrapper retain
        identity; and no typed or untouched source byte is lost or reordered.
    severity: blocking
    false_positive_risk: medium
    false_positive_note: >
      Host load affects latency, so the deterministic DOM-identity assertion is
      an independent gate. The fixed viewport, document family, warm-up count,
      sample count and page-internal event-to-animation-frame clock keep the
      numeric comparison reproducible without weakening either threshold.
    automation: full
    estimated_cost: high
    currently_holds: false
    status: confirmed

  # ---------------------------------------------------------------- family C

  - id: REQ-C1
    statement: >
      Switching between WYSIWYG and source leaves the caret on the same character
      of the text, in both directions. Column numbers may differ where the file
      contains markers the WYSIWYG does not display.
    category: invariant
    origin: user-statement, 2026-07-27 (P3), refined by D-019
    motivation: >
      Losing your place on every switch discourages using the source view — which
      is exactly the view that would reveal a damaged document.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - the character under the caret before the switch, and after
        - the same measured for a heading, a bold run, a list item, a table cell
      success_condition: >
        Same character, both directions, including at line start, line end, and
        on the boundary between two blocks. Where the caret sits on a marker that
        exists only in the source ("#", "*"), the mapping into the WYSIWYG must
        land on the first visible character of that construct, deterministically.
    severity: blocking
    false_positive_risk: medium
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed

  - id: REQ-C2
    statement: >
      After switching views, the physical source line displayed at the vertical
      midpoint of the window is the same line as before the switch, in both
      directions, wherever both views can centre that line naturally. At the
      beginning or end of the document, both views instead preserve the same
      natural scroll edge and must not create blank padding to fake centring.
      When the whole document fits in the viewport, it remains wholly visible
      and unscrolled whether the active position is at its start, middle or end.
    category: invariant
    origin: user-statement, 2026-07-28 (D-031)
    motivation: >
      REQ-C1 asks for the same character. That is identity, not visual anchoring:
      the same character can be drawn somewhere else entirely because headings,
      tables and code have different heights in the two views. The line at the
      window midpoint is the stable reference a person can actually compare.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - the physical source-line number at the vertical midpoint before and
          after the switch, in both directions
        - all six combinations of start/middle/end and content shorter/longer
          than the viewport, in both directions
        - the contained scroll viewport used by the actual application layout
      success_condition: >
        Away from a document edge, the source-line number at the window midpoint
        is identical in both views and both directions. At the first or last
        viewport, the arriving view is at the corresponding natural edge, with
        no synthetic blank area. If the content fits entirely, both views have
        zero scroll range and keep the entire document visible for all three
        active positions.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: true
    status: confirmed
    why_on_screen_and_not_in_the_document: >
      Matching the caret's position within the document was measured and
      rejected: headings, lists and code blocks have different heights in the
      two views. The physical source line at the midpoint is independent of
      those layout differences and is obtained by scrolling the arriving view
      until that line is at the same visual reference point.
    horizontal_deliberately_excluded: >
      Only the vertical is required. The same character sits at different
      columns and different widths between the views, since one hides the
      markers and scales headings; a tight horizontal tolerance would mean
      giving up the rendering and a loose one would assert nothing. Reconsider
      only if using it shows the caret being hunted for sideways — and then pick
      the tolerance from that case rather than in the abstract.
    note: >
      The two views scroll by different mechanisms — the rendered view grows and
      scrolls the page, the source is a fixed box that scrolls inside itself. A
      check written against either mechanism would measure the mechanism. On
      screen is the common ground.

  - id: REQ-C3
    statement: >
      A failure while producing WYSIWYG never leaves the editor empty. Source
      remains visible with the same text and an explicit warning.
    category: invariant
    origin: user-statement, 2026-08-14
    motivation: >
      A white editor makes the document appear lost and forces a reload even
      when the source model is still intact.
    risk_id: R-011
    verification:
      type: deterministic
      evidence_required:
        - an injected rendering exception during Source-to-WYSIWYG switching
        - visibility of both editor surfaces, the warning, and Markdown bytes
      success_condition: >
        Exactly Source is visible, its bytes equal the pre-switch document, and
        the user receives a warning that WYSIWYG was unavailable.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: confirmed

  # ---------------------------------------------------------------- family D

  - id: REQ-D1
    statement: >
      Content pasted from another application never disappears silently. What
      amorist cannot convert must still reach the file in a readable form.
    category: invariant
    origin: user-statement (Q-016 answer, D-023)
    motivation: >
      A pasted image currently vanishes entirely — no address, no alt text, no
      warning. Measured.
    risk_id: R-008
    verification:
      type: deterministic
      evidence_required:
        - "per paste fixture, the list of tokens that must survive — image
          address and alt text, every table cell value, link targets, list
          item text"
      success_condition: >
        Every declared token appears in the resulting file. Table cell values
        additionally appear on separate lines rather than concatenated.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed
    coverage_note: >
      This is deterministic per fixture, so its weakness is coverage, not
      evaluability. A semantic judge comparing pasted input against written
      output MAY be used OUTSIDE the gate to discover new cases; anything it
      finds becomes a deterministic fixture. The gate never calls a model.

  # ---------------------------------------------------------------- family E

  - id: REQ-E1
    statement: >
      Work not yet saved survives an abrupt termination. A working copy is
      written periodically to amorist's own location and offered for recovery on
      the next start.
    category: invariant
    origin: user-statement (Q-017 answer, D-024)
    motivation: >
      A crash, a power loss or a mis-clicked close confirmation currently loses
      everything typed since the last save, with no recovery path.
    risk_id: R-009
    verification:
      type: deterministic
      evidence_required:
        - text typed, the process killed without a save, the recovered content
      success_condition: >
        The recovered text matches what was typed, verbatim, up to the last
        working-copy interval. That interval MUST be stated in the
        implementation and asserted by the check.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: medium
    currently_holds: true
    status: confirmed

  - id: REQ-E2
    statement: >
      amorist never writes to the user's .md file except on an explicit save.
      The working copy of REQ-E1 is written elsewhere.
    category: invariant
    origin: derived from P1 and D-024
    motivation: >
      An autosave into the user's file would change it at moments the user did
      not choose, defeating the reason the primary value exists.
    risk_id: R-010
    verification:
      type: deterministic
      evidence_required:
        - the file's modification time and bytes, sampled during an editing
          session with no save
      success_condition: >
        Neither the bytes nor the modification time of the user's file change
        between opening it and the first explicit save.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: true
    status: recommendation

  # ---------------------------------------------------------------- family F
  # The write path. Verified in Rust, over real temporary files.

  - id: REQ-F1
    statement: >
      The file is written atomically. A failure during the write leaves the
      original file intact and leaves no partial file behind.
    category: regression
    origin: repository evidence — save_document writes to a tmp file then renames
    motivation: >
      This behaviour is correct today and must not regress while the save path is
      rewritten.
    risk_id: R-009
    verification:
      type: deterministic
      evidence_required:
        - a save into a read-only directory, a save with the tmp path blocked
        - the directory listing afterwards
      success_condition: >
        The original file is unchanged, no .amorist-tmp file remains, and the
        error is reported to the user rather than swallowed.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: true
    status: recommendation

  - id: REQ-F2
    statement: >
      A file modified outside amorist since it was opened is detected on save,
      and is never overwritten without an explicit user confirmation.
    category: regression
    origin: repository evidence — mtime comparison returning CONFLICT
    motivation: >
      Silently overwriting another program's changes is content loss of exactly
      the kind this contract exists to prevent.
    risk_id: R-009
    verification:
      type: deterministic
      evidence_required:
        - a file changed on disk between open and save
        - the returned error, and the file's bytes afterwards
      success_condition: >
        Save fails with a conflict, the file on disk is untouched, and it is
        overwritten only after the forced retry.
    severity: blocking
    false_positive_risk: medium
    false_positive_note: >
      Modification-time comparison has known limits: coarse timestamp resolution
      on some filesystems can miss a change made within the same tick. Content
      hashing would be exact. Flagged, not decided.
    automation: full
    estimated_cost: low
    currently_holds: true
    status: recommendation

  # ---------------------------------------------------------------- family G
  # Requirements on the checking system itself.

  - id: REQ-G1
    statement: >
      A check that cannot execute is a failure, never a pass. Missing browser,
      missing corpus, empty fixture directory: the runner exits non-zero and says
      which check could not run.
    category: invariant
    origin: recommendation, accepted risk-control
    motivation: >
      tests/app-shell-smoke.test.js exits successfully when no browser is found.
      A gate that turns green when it cannot look is worse than no gate, because
      it produces a false assurance.
    risk_id: R-007
    verification:
      type: deterministic
      evidence_required:
        - a run with the browser path sabotaged, and the runner's exit code
        - a run with an empty fixture directory, and the exit code
      success_condition: Non-zero exit and a named cause in both cases.
    severity: blocking
    false_positive_risk: low
    automation: full
    estimated_cost: low
    currently_holds: false
    status: recommendation

  - id: REQ-G2
    statement: >
      The editor checks run on the engines the product actually ships with, not
      only on a stand-in. Which engines those are is declared per platform: on
      Linux, WebKitGTK through its own WebDriver server; on macOS, Safari
      through the system's WebDriver server. Every check in families A, B, C and
      D runs unchanged on every engine applicable to the platform the suite is
      running on, and must pass on all of them.
    platform_engines:
      linux: [webkitgtk, chromium]
      macos: [safari, chromium]
    not_applicable_is_not_missing: >
      An engine that does not exist on the current platform is NOT a failure —
      Safari on Linux is not a missing engine, it is an inapplicable one. An
      engine that IS applicable and cannot be started is a failure. Collapsing
      the two would either turn every Linux run red for want of Safari, or teach
      the runner to forgive a genuinely absent engine. The report states which
      of the two it is holding.
    single_run_proves_one_platform: >
      A run on one platform says nothing about another. Release readiness
      therefore requires a green run per published platform, composed across
      runs rather than claimed from one.
    category: invariant
    origin: user-statement, 2026-07-28 (D-029) — the engine gap is to be closed
      by automation, not carried as a manual pass
    motivation: >
      Contenteditable and selection behaviour differ between engines. A suite
      that only ever sees a stand-in proves nothing about the binary the user
      runs, and families B and C — what the surface shows and where the caret
      lands — are exactly the parts where engines disagree.
    risk_id: R-017
    verification:
      type: deterministic
      evidence_required:
        - the engine name and version exercised by each run
        - a per-requirement verdict recorded separately for each engine
      success_condition: >
        Every check in families A, B, C and D produces a verdict on every engine
        applicable to the running platform, and passes on all of them. A
        requirement that passes on one engine and fails on another is a failure,
        and the report names which engine failed.
    severity: blocking
    false_positive_risk: medium
    false_positive_note: >
      Two engines mean two sets of engine-specific quirks. A divergence is real
      information, but it may indict the check rather than the product. The
      report must name the engine so the difference stays visible instead of
      being averaged into a single verdict. With engines on two platforms the
      space of quirks grows again, which is the price of the coverage.
    automation: full
    estimated_cost: medium
    currently_holds: false
    status: confirmed
    implementation_note: >
      WebKitGTK ships a standards-compliant WebDriver server as a separate
      distribution package, available at the same version as the library the
      application links against (2.52.3 on the development machine). It speaks
      plain HTTP, so it needs no third-party client library and respects the same
      zero-dependency constraint as the rest of the runner. A virtual display is
      required wherever no real one exists. On macOS the system's own driver
      must be enabled once by an administrator before it will accept a session;
      it needs a real graphical session rather than a virtual display. The
      stand-in engine stays in the suite rather than being replaced: it is
      faster to debug, and a check that behaves differently between engines is
      itself a finding.
    engine_naming_note: >
      The stand-in is any Chromium-family browser. It must be located by trying
      the known executable names in order, not by assuming one: the development
      machine has Google Chrome and no binary named "chromium", which the
      existing smoke test would fail to find.

  - id: REQ-G3
    statement: >
      Every report names the engines actually exercised, and names any published
      platform that automation does not reach, together with the cadence and the
      owner of its manual pass.
    category: human-decision
    origin: recommendation
    motivation: >
      Even with the shipping engine automated on one platform, another published
      platform stays outside automated reach. The report must not let that gap
      read as covered.
    risk_id: R-017
    verification:
      type: manual
      evidence_required:
        - a line in every report naming the platform it ran on, and each engine
          and version exercised there
        - the published platforms this run did NOT cover
        - for the residue automation cannot reach, the checklist used, how often
          it is run, and who runs it
      success_condition: >
        The report never claims coverage it does not have. While a manual pass is
        still needed it is this six-case list, run once per release by the
        repository owner: open and save without touching anything; correct one
        character; press Enter mid-line; switch to the source view and back;
        paste from a web page; kill the application without saving and recover.
    severity: advisory
    false_positive_risk: low
    automation: manual
    estimated_cost: low
    currently_holds: false
    status: confirmed
    residual_scope_note: >
      This requirement is scoped to PUBLISHED platforms deliberately. It shrinks
      as automation grows and becomes inapplicable altogether if a platform stops
      being published — so the lever for closing it is not only more automation
      but also the decision of what to ship. macOS is the only platform it
      currently covers: WKWebView has no equivalent driver, the Tauri WebDriver
      wrapper does not support macOS, and a proxy engine would be a different
      build of WebKit rather than the one that ships — which would be claiming
      coverage instead of having it.
