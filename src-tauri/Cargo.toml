[package]
name = "amorist"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "amorist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Already pulled in by Tauri/GTK; expose the existing native image decoder.
gdk-pixbuf = "=0.18.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
