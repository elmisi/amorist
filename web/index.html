<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amorist</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="editor/amorist-editor.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="identity">
          <strong id="app-name">amorist</strong>
          <span id="app-version" class="app-version"></span>
          <span id="file-name">Loading...</span>
        </div>
        <div class="actions">
          <details id="file-menu" class="file-menu" hidden>
            <summary>File</summary>
            <div class="file-menu-items">
              <button type="button" data-file-action="new">New</button>
              <button type="button" data-file-action="open">Open…</button>
              <button type="button" data-file-action="save-as">Save As…</button>
              <button type="button" data-file-action="reload">Reload</button>
            </div>
          </details>
          <button id="report-button" type="button" hidden>Segnala problema</button>
          <button id="reload-button" type="button">Reload</button>
          <button id="save-button" type="button">Save</button>
        </div>
      </header>

      <section id="notice" class="notice" hidden></section>
      <section id="editor" class="editor"></section>

      <footer class="statusbar">
        <span id="status">Starting</span>
        <span id="file-path"></span>
      </footer>
    </main>

    <dialog id="report-dialog" aria-labelledby="report-title">
      <form id="report-form">
        <h2 id="report-title">Segnala problema</h2>
        <label for="report-note">Qual è il problema? Descrivi anche cosa ti aspettavi.</label>
        <textarea id="report-note" rows="5" required></textarea>
        <p>La segnalazione include il documento e lo stato dell’editor al momento del clic. Viene salvata solo sul tuo computer.</p>
        <p id="report-error" role="alert"></p>
        <div class="actions">
          <button id="report-cancel" type="button">Annulla</button>
          <button id="report-submit" type="submit">Salva segnalazione</button>
        </div>
      </form>
    </dialog>

    <script src="editor/amorist-text-utils.js"></script>
    <script src="editor/amorist-document-model.js"></script>
    <script src="editor/amorist-table-codec.js"></script>
    <script src="editor/amorist-markdown-codec.js"></script>
    <script src="editor/amorist-html-to-markdown.js"></script>
    <script src="editor/amorist-editing-policy.js"></script>
    <script src="editor/amorist-editor.js"></script>
    <script src="debug-report.js"></script>
    <script src="file-actions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
